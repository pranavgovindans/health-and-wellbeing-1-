<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitaWell | Daily check</title><link rel="stylesheet" href="css/style.css"></head><body><main class="shell narrow"><header class="topbar"><a class="brand" href="health-default.html">← VitaWell</a><span class="step">DAILY HEALTH FORM</span></header><section class="dashboard-intro"><p class="eyebrow">A TWO-MINUTE CHECK-IN</p><h1>How are you today?</h1><p>Answer honestly to receive practical, gentle suggestions.</p></section><form id="dailyCheck" class="daily-form card"><label>Sleep hours<input id="sleepHours" required type="number" min="0" max="16" step="0.5" placeholder="7"></label><label>Water intake (glasses)<input id="waterGlasses" required type="number" min="0" max="20" placeholder="6"></label><label>Exercise minutes<input id="exerciseMinutes" required type="number" min="0" max="600" placeholder="30"></label><label>Mood<select id="mood"><option value="3">Good</option><option value="2">Okay</option><option value="1">Low</option></select></label><label>Stress level<select id="stress"><option value="1">Low</option><option value="2">Moderate</option><option value="3">High</option></select></label><label>Screen time (hours)<input id="screenTime" required type="number" min="0" max="24" step="0.5" placeholder="4"></label><label>Meals today<select id="meals"><option value="3">3 balanced meals</option><option value="2">Some meals</option><option value="1">Irregular meals</option></select></label><label>Current symptoms<input id="symptoms" placeholder="None, headache, tiredness..."></label><button class="btn primary span-2" type="submit">Calculate wellbeing score →</button></form><section id="checkResult" class="result-panel card hidden"><div class="result-score"><strong id="resultScore">0</strong><span>/100</span></div><div><p class="eyebrow">YOUR DAILY SCORE</p><h2 id="resultTitle"></h2><div id="suggestionList" class="suggestion-list"></div><a href="progress.html" class="btn primary">View progress →</a></div></section></main><script src="js/core.js"></script></body></html>
