<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitaWell | Wellness check-in</title><link rel="stylesheet" href="css/style.css"></head><body><main class="shell narrow"><header class="topbar"><a class="brand" href="health-default.html">Back to VitaWell</a><span class="step">DAILY CHECK-IN</span></header><section class="dashboard-intro"><p class="eyebrow">A MOMENT FOR YOU</p><h1>Wellness survey</h1><p>There are no right answers — simply check in with how today feels.</p></section><form id="wellnessSurvey" class="survey-form card"><fieldset><legend>How is your energy today?</legend><div class="answer-row"><label><input name="energy" value="Low" required type="radio"> Low</label><label><input name="energy" value="Okay" type="radio"> Okay</label><label><input name="energy" value="High" type="radio"> High</label></div></fieldset><fieldset><legend>How would you describe your mood?</legend><div class="answer-row"><label><input name="mood" value="Strained" required type="radio"> Strained</label><label><input name="mood" value="Balanced" type="radio"> Balanced</label><label><input name="mood" value="Positive" type="radio"> Positive</label></div></fieldset><fieldset><legend>Have you made time for yourself today?</legend><div class="answer-row"><label><input name="care" value="Not yet" required type="radio"> Not yet</label><label><input name="care" value="A little" type="radio"> A little</label><label><input name="care" value="Yes" type="radio"> Yes</label></div></fieldset><button class="btn primary" type="submit">Save my check-in</button></form><section id="surveyResult" class="assessment card hidden"><div><p class="eyebrow">YOUR CHECK-IN</p><h2 id="surveyTitle"></h2><p id="surveyAdvice"></p></div></section></main><script src="js/features.js"></script></body></html>
