<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitaWell | Heart health</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="health-default.html">← <span>VitaWell</span></a><span class="live-status" id="heartStatus"><i></i> READY TO MONITOR</span></header><section class="dashboard-intro"><p class="eyebrow">LIVE VITALS</p><h1>Heart health</h1><p>Watch a simulated real-time view of your vital signals.</p></section><section class="heart-hero card"><div class="pulse-wrap"><div class="pulse-circle">♡</div><div><span class="metric-label">HEART RATE</span><strong><span id="heartRate">72</span> <small>BPM</small></strong><p id="heartMessage">Ready when you are</p></div></div><button id="heartToggle" class="btn primary">Start monitoring</button></section><section class="chart-card card"><div class="chart-title"><div><span class="metric-label">HEART RHYTHM</span><h2>Live waveform</h2></div><span id="chartTime">00:00</span></div><canvas id="heartChart" height="210"></canvas></section><section class="vitals-grid"><article class="vital card"><span>◌</span><small>RESPIRATION</small><strong id="respiration">16 <em>br/min</em></strong><p>Normal range</p></article><article class="vital card"><span>♨</span><small>BODY TEMPERATURE</small><strong id="temperature">36.7 <em>°C</em></strong><p>Normal range</p></article><article class="vital card"><span>✦</span><small>BLOOD OXYGEN</small><strong id="oxygen">98 <em>%</em></strong><p>Excellent</p></article></section></main><script src="js/heart-dashboard.js"></script></body></html>
