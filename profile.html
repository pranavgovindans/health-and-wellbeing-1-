<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitaWell | Your profile</title><link rel="stylesheet" href="css/style.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html">VitaWell</a><span class="step">STEP 1 OF 2</span></header><section class="page-heading"><p class="eyebrow">LET'S GET TO KNOW YOU</p><h1>Your health profile</h1><p>These details help us personalise your overview.</p></section><form id="profileForm" class="profile-grid card"><label class="span-2 photo-input"><span id="photoPreview">+</span>Add profile photo<input id="profilePhoto" type="file" accept="image/*"></label><label>Full name<input required id="fullName" placeholder="e.g. Pranav"></label><label>Gender<select id="gender"><option value="Prefer not to say">Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option></select></label><label>Date of birth<input required id="dob" type="date"></label><label>Height (cm)<input required id="height" type="number" min="50" max="250" placeholder="170"></label><label>Weight (kg)<input required id="weight" type="number" min="15" max="350" step="0.1" placeholder="68"></label><label>Blood group<select id="blood"><option>Not specified</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Country<input id="country" placeholder="India"></label><label>State<input id="state" placeholder="Your state"></label><label>District<input id="district" placeholder="Your district"></label><label>Emergency contact<input id="emergency" type="tel" placeholder="Name / phone number"></label><label class="span-2">Allergies<input id="allergies" placeholder="e.g. None known"></label><label class="span-2">Medical conditions<input id="conditions" placeholder="e.g. None known"></label><button class="btn primary span-2" type="submit">Save and continue →</button></form></main><script src="js/script.js"></script><script src="js/device.js"></script></body></html>
