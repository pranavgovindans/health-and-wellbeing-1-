<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitaWell | Settings</title><link rel="stylesheet" href="css/style.css"></head><body><main class="shell narrow"><header class="topbar"><a class="brand" href="health-default.html">Back to VitaWell</a><span class="step">YOUR ACCOUNT</span></header><section class="dashboard-intro"><p class="eyebrow">PREFERENCES</p><h1>Settings</h1><p>Choose the reminders and activity target that feel useful for you.</p></section><form id="settingsForm" class="settings-form card"><label>Daily step goal<input id="settingsGoal" type="number" min="1000" max="50000" step="500" value="6000"></label><label class="switch-row">Water reminders<input id="settingsWater" type="checkbox" checked><span class="switch"></span></label><label class="switch-row">Gentle wellness tips<input id="settingsTips" type="checkbox" checked><span class="switch"></span></label><button class="btn primary" type="submit">Save preferences</button></form><button id="resetApp" class="danger-button">Reset all VitaWell data</button></main><script src="js/features.js"></script></body></html>
